name: decider-live

# Proves the handler end to end against the real pinned model on CPU: serve it,
# then run the live integration suite, which fails (not skips) when the server
# is absent. Supersedes decider-cpu-smoke.yml, whose day-one question it answers
# on every push to main and every PR.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "patterns/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/decider-live.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "patterns/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/decider-live.yml"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODEL: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
      PORT: "8099"
      STRANDS_DECIDER_URL: http://127.0.0.1:8099
      LACHESIS_REQUIRE_DECIDER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install package, CPU torch, Decider 0.1.0
        run: |
          set -o pipefail
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install strands-decider==0.1.0 transformers==5.19.0
          pip install -e ".[dev]"
          pip show strands-decider
          pip show strands-agents

      - name: Serve pinned model on CPU
        run: |
          strands-decider serve "$MODEL" --device cpu --port "$PORT" > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 180); do
            if curl -sf "http://127.0.0.1:$PORT/health" > health.json 2>/dev/null; then
              echo "server ready after about $((i * 10)) s"
              cat health.json
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "server process died; last 40 lines of server.log:"
              tail -40 server.log
              exit 1
            fi
            sleep 10
          done
          echo "server did not answer /health within 30 minutes"
          tail -40 server.log
          exit 1

      - name: Live integration suite (must run, not skip)
        run: |
          set -o pipefail
          pytest tests/integration -p no:cacheprovider --no-cov -q -rs | tee live.txt
          if grep -qiE "skipped|no tests ran" live.txt; then
            echo "::error::the live suite skipped. The handler seam is unproven."
            exit 1
          fi

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decider-live
          path: |
            health.json
            live.txt
            server.log
