name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The secret scan runs first and over history, not over the working tree. A
  # credential repaired in the tree but left in a commit is still published.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over every fetched branch and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lachesis-gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks --dir /tmp/lachesis-gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt
          (cd /tmp/lachesis-gitleaks && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -)
          tar -xzf /tmp/lachesis-gitleaks/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/lachesis-gitleaks gitleaks
          test "$(git rev-parse --is-shallow-repository)" = "false"
          /tmp/lachesis-gitleaks/gitleaks git . --log-opts=--all --redact \
            --report-format=json --report-path=secrets-report.json
      - name: Report finding locations without secret values
        if: always()
        run: |
          if [ -f secrets-report.json ]; then
            jq '[.[] | {RuleID, File, StartLine, Commit, Fingerprint}]' secrets-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-history-secret-scan-${{ github.run_id }}
          path: secrets-report.json
          retention-days: 90
          if-no-files-found: error

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: transformers stays pinned next to every strands-decider install
        run: |
          set -euo pipefail
          # transformers 5.20.0 (2026-10-15) breaks CPU serves against
          # the pinned torch 2.7.1; every install line that names
          # strands-decider must pin transformers==5.19.0 with it.
          bad=$(grep -rn "strands-decider" --include="*.yml" --include="*.md" --include="*.sh" --include="Dockerfile" .github README.md patterns scripts decider-image agent 2>/dev/null | grep -v "transformers==5.19.0" | grep -v "strands-decider==" | grep "pip install" || true)
          bad2=$(grep -rn "pip install" --include="*.yml" --include="*.md" --include="*.sh" --include="Dockerfile" .github README.md patterns scripts decider-image agent 2>/dev/null | grep "strands-decider" | grep -v "transformers==5.19.0" || true)
          if [ -n "$bad2" ]; then echo "unpinned transformers next to:"; echo "$bad2"; exit 1; fi
          echo "all strands-decider installs pin transformers==5.19.0"
      - name: The judged console answers 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://d2nm49ao7e8z4z.cloudfront.net)
          echo "console HTTP $code"
          test "$code" = "200"

  iac:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK
        run: |
          pip install -r infra/requirements.txt
          npm install -g aws-cdk@2
      - name: Synth and template policy checks
        working-directory: infra
        run: |
          cdk synth --all --output ../cdk.out.synth
          python ../infra/check_templates.py ../cdk.out.synth

  test:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ patterns/ scripts/

      # The unit suite needs no Decider server, no AWS account and no
      # credentials. CI runs it with none configured rather than inheriting
      # any that happen to exist.
      - name: Tests, with the coverage floor enforced
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_DEFAULT_REGION: eu-west-1
        run: pytest -q
