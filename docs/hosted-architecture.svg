<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title description">
<title id="title">Lachesis: hosted architecture</title>
<desc id="description">A public visitor or approver reaches the CloudFront and S3 console. Cognito identifies approvers. API Gateway calls the approvals API and runner Lambda. Lambda stores run state and pause events in DynamoDB and invokes the Strands agent on AgentCore Runtime V2. The agent uses Amazon Bedrock and the SageMaker Decider endpoint. DynamoDB streams feed a publisher Lambda, EventBridge and Firehose, then the S3 audit lake and Athena.</desc>
