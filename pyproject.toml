[project]
name = "lachesis-guard"
version = "0.1.0"
description = "A Strands InterventionHandler that scores every tool call for risk before it runs"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.53.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=lachesis --cov-report=term-missing --cov-fail-under=85"
markers = ["live: needs a live Decider server (skips without one, fails without one under decider-live.yml)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ISC"]
